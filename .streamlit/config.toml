[theme]
base = "dark"

# General color setup
primaryColor = "#c72934"
backgroundColor = "#212750"
secondaryBackgroundColor="#1a1a3d"
textColor = "#f8f8f2"

# Widgets
showWidgetBorder = true
borderColor = "#4c596bff"

# Dataframes
dataframeHeaderBackgroundColor = "#1d293d"
dataframeBorderColor = "#4c596bff"

# Heading text
headingFontWeights = [300, 400, 400, 300, 300, 300]
headingFontSizes = ["2.5rem", "1.5rem", "1rem"]
